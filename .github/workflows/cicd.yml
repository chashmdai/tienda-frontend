name: CI/CD Tienda Perritos - Frontend

on:
  push:
    branches: [ "deploy" ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tienda-frontend

jobs:
  build-push-deploy:
    name: Build, push y deploy a EC2-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push imagen Frontend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:latest" -t "${IMAGE_URI}:${GITHUB_SHA::7}" .
          docker push "${IMAGE_URI}:latest"
          docker push "${IMAGE_URI}:${GITHUB_SHA::7}"

      - name: Deploy a EC2-frontend via SSM
        env:
          REGISTRY:     ${{ steps.ecr-login.outputs.registry }}
          INSTANCE_ID:  ${{ secrets.EC2_FRONTEND_INSTANCE_ID }}
          BACKEND_HOST: ${{ secrets.BACKEND_HOST }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
        run: |
          cat > /tmp/cmd.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${REGISTRY}",
              "docker pull ${REGISTRY}/${ECR_REPOSITORY}:latest",
              "docker rm -f tienda-frontend || true",
              "docker run -d --name tienda-frontend --restart unless-stopped -p 80:80 -e BACKEND_HOST='${BACKEND_HOST}' -e BACKEND_PORT='${BACKEND_PORT}' ${REGISTRY}/${ECR_REPOSITORY}:latest",
              "docker image prune -f"
            ]
          }
          EOF
          aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy tienda-frontend ${GITHUB_SHA::7}" \
            --parameters file:///tmp/cmd.json \
            --output text
